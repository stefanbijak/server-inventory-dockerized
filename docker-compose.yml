services:
  database:
    image: mysql:latest
    container_name: database
    ports:
      - 3307:3306
    volumes:
      - ./database/mysql_template.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    env_file:
      - database/database.env
    networks:
      backend:
        ipv4_address: 192.168.10.10
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-u","root"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    container_name: backend
    env_file:
      - ./backend/.env
    depends_on:
      database:
        condition: service_healthy
    ports:
      - 6969:6969
    networks:
      backend:
        ipv4_address: 192.168.10.20
      frontend:
        ipv4_address: 192.168.20.20
  frontend:
    build:
      context: .
      dockerfile: frontend/nginx_conf/Dockerfile
    container_name: frontend
    depends_on:
      - backend
    ports:
      - 8181:80
    networks:
      frontend:
        ipv4_address: 192.168.20.10
volumes:
  mysql_data:
networks:
  backend:
    ipam:
      config:
        - subnet: 192.168.10.0/24
          gateway: 192.168.10.1
  frontend:
    ipam:
      config:
        - subnet: 192.168.20.0/24
          gateway: 192.168.20.1
