services:
  database:
    image: mysql:latest
    container_name: database
    ports:
      - 3307:3306
    volumes:
      - ./database/mysql_template.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    env_file:
      - database/database.env
    networks:
      backend:
        ipv4_address: 192.168.10.10
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-u","root"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    container_name: backend
    env_file:
      - ./backend/.env
    depends_on:
      database:
        condition: service_healthy
    ports:
      - 6969:6969
    networks:
      backend:
        ipv4_address: 192.168.10.20
      frontend:
        ipv4_address: 192.168.20.20
  frontend:
    build:
      context: .
      dockerfile: frontend/nginx_conf/Dockerfile
    container_name: frontend
    depends_on:
      - backend
    ports:
      - 8181:80
    networks:
      frontend:
        ipv4_address: 192.168.20.10
  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: mysql_exporter
    environment:
      - DATA_SOURCE_NAME=root:1234@(database:3306)/iptv_db
    command:
      - '--mysqld.address=database:3306'
      - '--mysqld.username=root:1234'
    depends_on:
      database:
        condition: service_healthy
    networks:
      backend:
        ipv4_address: 192.168.10.30
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    ports:
      - 9091:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      backend:
        ipv4_address: 192.168.10.40
      frontend:
        ipv4_address: 192.168.20.40
  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana
    ports:
      - 3000:3000
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      frontend:
        ipv4_address: 192.168.20.50
volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
networks:
  backend:
    ipam:
      config:
        - subnet: 192.168.10.0/24
          gateway: 192.168.10.1
  frontend:
    ipam:
      config:
        - subnet: 192.168.20.0/24
          gateway: 192.168.20.1
