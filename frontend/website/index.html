<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Network Infrastructure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app" role="application">

  <!-- HEADER / NAVBAR -->
  <header>

    <!-- Left: brand -->
    <a href="index.html" class="nav-brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="3" width="20" height="6" rx="2"/>
        <rect x="2" y="15" width="20" height="6" rx="2"/>
        <line x1="6" y1="6" x2="6.01" y2="6"/>
        <line x1="6" y1="18" x2="6.01" y2="18"/>
      </svg>
      IPTV Servers
    </a>

    <!-- Center: nav links -->
    <ul class="nav-links">
      <li><a href="index.html"     class="nav-link active">Servers</a></li>
      <li><a href="vlans.html"     class="nav-link">VLANs</a></li>
      <li><a href="inventory.html" class="nav-link">Inventory</a></li>
      <li><a href="free_ips.html" class="nav-link">Free IPs</a></li>
    </ul>

    <div id="breadcrumb" style="display:none;"></div>

  </header>

  <!-- MILLER COLUMNS -->
  <div class="miller-columns">

    <!-- COL 1: GROUPS -->
    <div class="col col-groups">
      <div class="col-head">
        <h2>Groups</h2>
        <button class="add-btn" id="btn-add-group" aria-label="Add group" title="Add group">+</button>
      </div>
      <!-- ul is fine here — renderGroups() only puts <li> items inside -->
      <ul class="list" id="group-list" role="listbox" aria-label="Groups"></ul>
    </div>

    <!-- COL 2: SERVERS -->
    <div class="col col-servers">
      <div class="col-head">
        <h2>Servers</h2>
        <button class="add-btn" id="btn-add-server" aria-label="Add server" title="Add server" disabled>+</button>
      </div>
      <!-- div instead of ul — renderServers() puts both a <ul> and a footer <div> inside -->
      <div class="col-body" id="server-list" aria-label="Servers"></div>
    </div>

    <!-- COL 3: DETAILS -->
    <div class="col">
      <div class="col-head">
        <h2>Network Interfaces</h2>
        <button class="add-btn" id="btn-add-iface" aria-label="Add interface" title="Add interface" disabled>+</button>
      </div>
      <div class="detail-body" id="detail-body"></div>
    </div>

  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title">Add</h3>
      <button class="modal-close" id="modal-close" aria-label="Close">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost"   id="modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="modal-confirm">Save</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="utils.js"></script>
<script src="state.js"></script>
<script src="api.js"></script>
<script src="render.js"></script>
<script src="actions.js"></script>
<script src="script.js"></script>
</body>
</html>
