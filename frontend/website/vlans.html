<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VLANs — NetInventory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app" role="application">

  <!-- HEADER / NAVBAR -->
  <header>

    <!-- Left: brand -->
    <a href="index.html" class="nav-brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="3" width="20" height="6" rx="2"/>
        <rect x="2" y="15" width="20" height="6" rx="2"/>
        <line x1="6" y1="6" x2="6.01" y2="6"/>
        <line x1="6" y1="18" x2="6.01" y2="18"/>
      </svg>
      NetInventory
    </a>

    <!-- Center: nav links -->
    <ul class="nav-links">
      <li><a href="index.html"     class="nav-link">Servers</a></li>
      <li><a href="vlans.html"     class="nav-link active">VLANs</a></li>
      <li><a href="inventory.html" class="nav-link">Inventory</a></li>
      <li><a href="free_ips.html" class="nav-link">Free IPs</a></li>
    </ul>

    <!-- Right: avatar -->
    <div class="nav-right"></div>

  </header>

  <!-- PAGE CONTENT -->
  <div class="page-body">
    <div class="page-content">

      <!-- Toolbar: title + add button -->
      <div class="page-toolbar">
        <h1 class="page-title">VLANs</h1>
        <button class="btn btn-primary" id="btn-add-vlan">+ Add VLAN</button>
      </div>

      <!-- VLAN table -->
      <div class="table-wrapper">
        <table class="details-table" id="vlan-table">
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">IP Range</th>
              <th scope="col">Subnet Mask</th>
              <th scope="col">Type</th>
              <th scope="col"></th>
            </tr>
          </thead>
          <tbody id="vlan-tbody">
            <!-- Rows injected by vlans.js -->
            <tr>
              <td colspan="5" style="text-align:center; padding:2rem; color:#888;">
                Loading...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title">Add VLAN</h3>
      <button class="modal-close" id="modal-close" aria-label="Close">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost"   id="modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="modal-confirm">Save</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="vlans.js"></script>
</body>
</html>
